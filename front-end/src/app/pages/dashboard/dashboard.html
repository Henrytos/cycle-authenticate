<main>

  <app-header />


  <section>
    <app-title>
      Dashboard
    </app-title>

    <div class="grid">

      <!-- METRICS -->

      <div class="charts-content">

        <div class="card grid-column-3 grid-row-3 chart-sale">
          <div class="top">
            <div class="icon">
              <lucide-icon name="wallet"></lucide-icon>

            </div>
            <h4>
              Saldo
            </h4>
          </div>

          <div class="bottom">

            <h1>R$ 2.700</h1>

            <lucide-icon name="eye"></lucide-icon>

          </div>
        </div>

        <div class="card grid-column-1 grid-row-3 char-investment">
          <div class="top">
            <div class="icon">
              <lucide-icon name="piggy-bank"></lucide-icon>
            </div>
            <h4>Investido</h4>
          </div>
          <div>
            <h1>
              R$ 2.000
            </h1>

          </div>
        </div>
        <div class="card grid-column-1 grid-row-3 char-up">
          <div class="top">
            <div class="icon">
              <lucide-icon name="trending-up"></lucide-icon>
            </div>
            <h4>Receita</h4>
          </div>

          <div>
            <h1>
              R$ 2.700
            </h1>

          </div>
        </div>

        <div class="card grid-column-1 grid-row-3 char-down">
          <div class="top">
            <div class="icon">
              <lucide-icon name="trending-down"></lucide-icon>
            </div>
            <h4>Despesas</h4>

          </div>
          <div>
            <h1>
              R$ 2.700
            </h1>

          </div>
        </div>

        <div class="card grid-column-1 grid-row-6 chart-pie">

          <canvas #chartCanvas></canvas>

        </div>

        <div class="card grid-column-2 grid-row-6">

        </div>
      </div>

      <!-- TRANSACTIONS HISTORY -->

      <app-list-transaction></app-list-transaction>
    </div>

  </section>
</main>
