<main>

  <app-header />


  <section>
    <app-title>
      Dashboard
    </app-title>

    <div class="grid">

      <!-- METRICS -->

      <div class="charts-content">

        <div class="card grid-column-3 grid-row-3 chart-sale">
          <div class="top">
            <div class="icon">
              <lucide-icon name="wallet"></lucide-icon>

            </div>
            <h4>
              Saldo
            </h4>
          </div>

          <div class="bottom">
            <div class="sale">
              <h1> R$ {{metrics().sale}}</h1>

              <lucide-icon name="eye"></lucide-icon>
            </div>

            <button matButton (click)="openDialog()" class="button-new-transaction">
              <p>Adicionar Transação</p>
              <lucide-icon name="arrow-down-up">
              </lucide-icon>
            </button>


          </div>


        </div>

        <div class="card grid-column-1 grid-row-3 char-investment">
          <div class="top">
            <div class="icon">
              <lucide-icon name="piggy-bank"></lucide-icon>
            </div>
            <h4>Investido</h4>
          </div>
          <div>
            <h1>
              R$ {{metrics().investment}}
            </h1>

          </div>
        </div>
        <div class="card grid-column-1 grid-row-3 char-up">
          <div class="top">
            <div class="icon">
              <lucide-icon name="trending-up"></lucide-icon>
            </div>
            <h4>Receita</h4>
          </div>

          <div>
            <h1>
              R$ {{metrics().deposit}}

            </h1>

          </div>
        </div>

        <div class="card grid-column-1 grid-row-3 char-down">
          <div class="top">
            <div class="icon">
              <lucide-icon name="trending-down"></lucide-icon>
            </div>
            <h4>Despesas</h4>

          </div>
          <div>
            <h1>
              R$ {{metrics().spent}}
            </h1>

          </div>
        </div>

        <div class="card grid-column-1 grid-row-6 chart-pie">

          <canvas #chartCanvas></canvas>

        </div>

        <div class="card grid-column-2 grid-row-6 chart-catories">
          <h2>
            Gastos por categoria
          </h2>

          <span class="line"></span>

          <div class="categories">

            @for (category of spendingByCategory; track category.id) {
            <div class="category">
              <div class="top">
                <h3>
                  {{category.type}}
                </h3>
                <p>
                  {{category.progress}}%
                </p>
              </div>
              <div class="progress">
                <div class="progress-target" [style.width]="category.progress + '%'"></div>
              </div>

              <span class="bottom">
                R$ {{category.value}}
              </span>
            </div>

            }

          </div>
        </div>
      </div>

      <!-- TRANSACTIONS HISTORY -->

      <app-list-transaction></app-list-transaction>
    </div>

  </section>
</main>
