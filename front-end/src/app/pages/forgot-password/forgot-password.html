<main>

    <div class="content-form">
        <app-logo />
        <app-title>
            Recuperar sua conta
        </app-title>

        @if(isChangePassword){
        <form [formGroup]="changePasswordForm" (ngSubmit)="changePasswordFormSubmit()" novalidate class="visible">

            <div class="form-control">
                <label for="password">Nova Senha
                    @if(changePasswordForm.get("password")?.errors && changePasswordForm.get("password")?.touched){
                    <span class="error-message">(Preencha este campo)</span>
                    }
                </label>
                <input type="password" name="password" id="password" formControlName="password">
            </div>

            <div class="form-control">
                <label for="confirmPassword">Confirmar Nova Senha
                    @if(changePasswordForm.get("confirmPassword")?.errors &&
                    changePasswordForm.get("confirmPassword")?.touched){
                    <span class="error-message">(Preencha este campo)</span>
                    }
                </label>
                <input type="password" name="confirmPassword" id="confirmPassword" formControlName="confirmPassword">
            </div>

            <button type="submit">
                Confirmar Nova Senha
            </button>
        </form>
        }
        @else {
        <p class="visible-info">Insira a ID de início de sessão (endereço de email) de sua conta. Enviaremos um link
            para recuperar sua
            conta.</p>


        <form [formGroup]="forgotPasswordForm" (ngSubmit)="forgotPasswordFormSubmit()" novalidate class="visible">

            <div class="form-control">
                <label for="email">ID de início de sessão
                    @if(forgotPasswordForm.get("email")?.errors && forgotPasswordForm.get("email")?.touched){
                    <span class="error-message">(Preencha este campo)</span>
                    }
                </label>
                <input type="email" name="email" id="email" formControlName="email">
            </div>

            <button type="submit">
                Enviar Link
            </button>
        </form>

        }



        <p class="text">
            Caso já tenha uma conta , <a routerLink="/login">Faça login</a>
        </p>

        <p class="text">
            Caso não tenha uma conta , <a routerLink="/register">Registre-se</a>
        </p>
    </div>

    <div class="content-bg">
        <img src="/bg-login.png" alt="backgroun application overview">
    </div>

</main>

<router-outlet />
