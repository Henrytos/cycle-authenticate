<main>

  <div class="content-form">
    <app-logo />
    <app-title>
      Bem-vindo
    </app-title>
    <p>A Finance AI é uma plataforma de gestão financeira que utiliza IA para monitorar suas movimentações, e oferecer
      insights
      personalizados, facilitando o controle do seu orçamento.
    </p>


    <form [formGroup]="loginForm" (ngSubmit)="loginFormSubmit()" [noValidate]="true">

      <div class="form-control">
        <label for="email">Email:
          @if(loginForm.get("email")?.errors && loginForm.get("email")?.touched){
          <span class="error-message">(Preencha este campo)</span>
          }
        </label>
        <input type="email" name="email" id="email" formControlName="email">
      </div>

      <div class="form-control">
        <label for="password">Senha:
          @if(loginForm.get("password")?.errors && loginForm.get("password")?.touched){
          <span class="error-message">(Preencha este campo)</span>
          }
        </label>
        <input type="password" name="password" id="password" formControlName="password">
      </div>

      <button>
        Entrar
      </button>
    </form>

    <p class="text">
      Caso não tenha uma conta , <a routerLink="/register">Registre-se</a>
    </p>

  </div>

  <div class="content-bg">
    <img src="/bg-login.png" alt="backgroun application overview">
  </div>

</main>

<router-outlet />
