<main>

  <div class="content-form">
    <app-logo />

    <app-title>
      Bem-vindo
    </app-title>
    <p>Faça parte da finanças AI e impulsione seus investimentos e lucros</p>


    <form [formGroup]="registerForm" (ngSubmit)="loginFormSubmit()" [noValidate]="true">

      <div class="form-control">
        <label for="username">Nome De Usuario:</label>
        <input type="username" name="username" id="username" formControlName="username">
      </div>

      <div class="form-control">
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" formControlName="email">
      </div>

      <div class="form-control">
        <label for="password">Senha:</label>
        <input type="password" name="password" id="password" formControlName="password">
      </div>

      <div class="form-control">
        <label for="dateOfBirth">Data De Nascimento:</label>
        <input type="date" name="dateOfBirth" id="dateOfBirth" formControlName="dateOfBirth">
      </div>

      <button>
        Cadastrar
      </button>
    </form>

    <p class="text">
      Caso já tenha uma conta , <a routerLink="/login">Login</a>
    </p>

  </div>

  <div class="content-bg">
    <img src="/bg-login.png" alt="backgroun application overview">
  </div>

</main>
<ngx-sonner-toaster />
<router-outlet />
