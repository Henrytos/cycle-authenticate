<main>

  <div class="content-form">
    <app-logo />

    <app-title>
      Bem-vindo
    </app-title>
    <p>Faça parte da finanças AI e impulsione seus investimentos e lucros</p>


    <form [formGroup]="registerForm" (ngSubmit)="loginFormSubmit()" [noValidate]="true">

      <div class="form-control">
        <label for="username">Nome De Usuario
          @if(registerForm.get("username")?.errors && registerForm.get("username")?.touched){
          <span class="error-message">(Preencha este campo)</span>
          }
          :</label>
        <input type="username" name="username" id="username" formControlName="username">
      </div>

      <div class="form-control">
        <label for="email">Email:
          @if(registerForm.get("email")?.errors && registerForm.get("email")?.touched){
          <span class="error-message">(Preencha este campo)</span>
          }
        </label>
        <input type="email" name="email" id="email" formControlName="email">
      </div>

      <div class="form-control">
        <label for="password">Senha:
          @if(registerForm.get("password")?.errors && registerForm.get("password")?.touched){
          <span class="error-message">(Preencha este campo)</span>
          }
        </label>
        <input type="password" name="password" id="password" formControlName="password">
      </div>

      <div class="form-control">
        <label for="dateOfBirth">Data De Nascimento:
          @if(registerForm.get("dateOfBirth")?.errors && registerForm.get("dateOfBirth")?.touched){
          <span class="error-message">(Preencha este campo)</span>
          }
        </label>
        <input type="date" name="dateOfBirth" id="dateOfBirth" formControlName="dateOfBirth">
      </div>

      <button>
        Cadastrar
      </button>
    </form>

    <p class="text">
      Caso já tenha uma conta , <a routerLink="/login">Login</a>
    </p>

  </div>

  <div class="content-bg">
    <img src="/bg-login.png" alt="backgroun application overview">
  </div>

</main>
<router-outlet />
